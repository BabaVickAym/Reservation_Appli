name: Trello Integration

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, closed]

jobs:
  update-trello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Extract Trello Card ID from commit message
        id: extract
        shell: bash
        run: |
          # Récupère le message du commit
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Message du commit: $COMMIT_MSG"
          
          # Cherche le motif [TRELLO-XXXXX] et extrait l'ID
          # Exemple : [TRELLO-baUWZweS] -> extrait baUWZweS
          CARD_ID=$(echo "$COMMIT_MSG" | grep -oP '\[TRELLO-\K[^]]+' || echo "")
          
          echo "ID Carte trouvé: $CARD_ID"
          echo "card_id=$CARD_ID" >> $GITHUB_OUTPUT

      - name: Add comment to Trello card
        if: steps.extract.outputs.card_id != ''
        run: |
          # Envoie un commentaire sur la carte avec le lien du commit
          curl -X POST "https://api.trello.com/1/cards/${{ steps.extract.outputs.card_id }}/actions/comments" \
            -d "key=${{ secrets.TRELLO_API_KEY }}" \
            -d "token=${{ secrets.TRELLO_TOKEN }}" \
            --data-urlencode "text=Commit poussé par ${{ github.actor }} : ${{ github.event.head_commit.message }} (Voir le commit: ${{ github.event.head_commit.url }})"

      - name: Move card to TERMINÉ (main branch only)
        if: github.ref == 'refs/heads/main' && steps.extract.outputs.card_id != ''
        run: |
          # Déplace la carte dans la liste définie dans le secret (Ici: Terminé)
          curl -X PUT "https://api.trello.com/1/cards/${{ steps.extract.outputs.card_id }}" \
            -d "key=${{ secrets.TRELLO_API_KEY }}" \
            -d "token=${{ secrets.TRELLO_TOKEN }}" \
            -d "idList=${{ secrets.TRELLO_LIST_EN_REVUE }}"
